<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя Система</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f1ea; color: #333; padding: 20px; }
    h1 { color: #b5838d; }
    .section { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .section h2 { margin-top: 0; color: #b5838d; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
    .done { text-decoration: line-through; color: #aaa; }
  </style>
</head>
<body>
  <h1>🌸 Моя Система</h1>
  
  <div class="section">
    <h2>📚 Учеба</h2>
    <ul id="study-list">
      <li>Курсовая работа — дедлайн 25.10</li>
      <li>Домашка по матану — дедлайн 30.09</li>
    </ul>
  </div>

  <div class="section">
    <h2>👩‍🏫 Преподавание</h2>
    <ul id="teach-list">
      <li>Маша — 15:00, тема: дроби</li>
      <li>Петя — 17:00, тема: уравнения</li>
    </ul>
  </div>

  <div class="section">
    <h2>📦 WB (Карточки)</h2>
    <ul id="wb-list">
      <li>Поставка №1 — в пути</li>
    </ul>
  </div>

  <div class="section">
    <h2>💰 Финансы</h2>
    <ul id="finance-list">
      <li>Накоплено: 5000 ₽ / Цель: 50000 ₽</li>
    </ul>
  </div>
</body>
</html>
